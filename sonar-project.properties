sonar.projectKey=herst-connect-v1
sonar.projectName=Herst Connect V1
# sonar.host.url : fourni via SONAR_HOST_URL au lancement (pnpm sonar) — jamais GPU1 en dur ici.

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*.test.*,**/*.spec.*

# `src/components/catalyst/**` est le kit Catalyst officiel (Tailwind Plus), vendoré
# non modifié : zone no-touch déclarée dans CLAUDE.md. On ne le corrige pas, on le
# remplace en bloc par une version plus récente du kit — l'analyser produit une dette
# qu'aucune correction légitime ne peut fermer ici.
sonar.exclusions=src/components/catalyst/**,**/*.test.*,**/*.spec.*,**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/storybook-static/**,**/coverage/**,**/playwright-report/**,**/test-results/**

# Couverture : Vitest (v8) → lcov. Hors périmètre unitaire : UI App Router,
# kit Catalyst, actions serveur, client HTTP I/O, thèmes purs, helpers d’affichage.
# La gate CAYC mesure le noyau testé (session, resolved, auth, registre, etc.).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/app/**,\
  src/components/**,\
  src/styles/**,\
  src/lib/actions.ts,\
  src/components/charts/core/chart-theme.ts,\
  src/lib/env.ts,\
  src/lib/mouvements.ts,\
  src/lib/theme.ts,\
  src/lib/backend/client.ts,\
  src/lib/backend/keeper.ts,\
  src/lib/backend/probe.ts

# `endpoints.ts` est le registre contrat (26 routes) : déclaratif et volontairement
# homogène, ce que la détection de copier-coller lit comme des blocs dupliqués.
# C'est de la donnée de contrat, pas de la logique à factoriser.
#
# NB : l'ancienne entrée `src/lib/demo-data.ts` a été retirée le 2026-08-04 — le
# fichier n'existe plus (données de démonstration supprimées ; l'absence de donnée
# simulée est désormais garantie par `pnpm check:mocks`).
sonar.cpd.exclusions=src/lib/backend/endpoints.ts

# `@custom-variant` / `@slot` (Tailwind CSS v4) ne sont pas reconnus par le
# parser CSS générique de Sonar, qui les lit comme des at-rules sans sélecteur
# racine ("Missing scoping root") — deux faux positifs BUG sur une syntaxe
# standard du framework, pas un défaut de portée réel.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.e1.resourceKey=src/styles/tailwind.css

sonar.sourceEncoding=UTF-8
