# Scripts de post-installation autorisés (binaires natifs légitimes) :
# - sharp         : optimisation d'images de next/image en production
# - unrs-resolver : résolveur natif utilisé par eslint-import-resolver
# - esbuild       : binaire natif de vitest
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# SEC-03 : forcer les versions corrigées de brace-expansion (advisory
# GHSA — DoS), transitive et dev-only (eslint, vitest coverage). Les trois
# lignes présentes (1.x, 2.x, 5.x) sont chacune un patch sous le correctif.
overrides:
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9

# Paquets exclus de la politique locale minimumReleaseAge (outillage qualité
# posé par hearst-setup ; versions épinglées dans pnpm-lock.yaml).
minimumReleaseAgeExclude:
  - jscpd-darwin-arm64@5.0.14
  - jscpd-darwin-x64@5.0.14
  - jscpd-linux-arm64-gnu@5.0.14
  - jscpd-linux-x64-gnu@5.0.14
  - jscpd-linux-x64-musl@5.0.14
  - jscpd-windows-x64-msvc@5.0.14
  - jscpd@5.0.14
